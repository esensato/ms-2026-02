spring.application.name=aluno-restful
server.port=9099
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
logging.level.org.springframework.security.provisioning=TRACE
management.endpoints.web.exposure.include=prometheus
management.endpoint.shutdown.access=UNRESTRICTED

logging.file.name=logs/aluno-service.log
spring.boot.admin.client.url=http://localhost:9082

spring.jpa.show-sql=true

#spring.security.user.name = teste
#spring.security.user.password = 123

#integracao com disciplia via Kafka
# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Application Topics
topic.name.producer=MeuTopico
logging.level.nome.pacote=DEBUG